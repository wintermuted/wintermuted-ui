name: Publish package (recovery)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact package version tag to inspect, recover assets for, or republish"
        required: true
      project:
        description: "Package to republish"
        type: choice
        options: [ui-theme, ui-react, ui-react-select]
        default: ui-theme
      dry_run:
        description: "Preview publication without publishing"
        type: boolean
        default: true
      verify_only:
        description: "Only download and verify the registry version; no tag is required and nothing is published"
        type: boolean
        default: false
      assets_only:
        description: "Attach the verified npm tarball to its existing GitHub release; never build or publish"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  assets:
    if: inputs.assets_only
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate recovery mode
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          if [ "$VERIFY_ONLY" = "true" ]; then
            echo "Select only one recovery mode."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check release asset recovery behavior
        run: node --test scripts/release-assets.test.mjs scripts/release-publication.test.mjs
      - name: Recover the verified package release asset without npm publication
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-assets.mjs "$RELEASE_TAG"
  publish:
    if: ${{ !inputs.assets_only }}
    runs-on: ubuntu-latest
    environment: wintermuted-ui-theme
    env:
      NX_DAEMON: "false"
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verify_only && github.sha || inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: inputs.verify_only
        with:
          node-version: 22
      - name: Inspect the exact registry version and verify its tarball
        if: inputs.verify_only
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release-publication.mjs --inspect "$RELEASE_TAG"
      - uses: actions/setup-node@v4
        if: ${{ !inputs.verify_only }}
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install npm with trusted publishing support
        if: ${{ !inputs.verify_only }}
        run: npm install --global npm@11.5.1 --registry=https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
        if: ${{ !inputs.verify_only }}
      - name: Verify package release identity
        if: ${{ !inputs.verify_only }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PROJECT: ${{ inputs.project }}
        run: |
          VERSION=$(node -p "require('./packages/' + process.env.RELEASE_PROJECT + '/package.json').version")
          if [ "$RELEASE_TAG" != "$RELEASE_PROJECT@$VERSION" ]; then
            echo "The requested tag does not match the package version."
            exit 1
          fi
      - name: Stage the selected React package
        if: ${{ !inputs.verify_only && inputs.project != 'ui-theme' }}
        env:
          RELEASE_PROJECT: ${{ inputs.project }}
        run: npx nx build "$RELEASE_PROJECT"
      - name: Publish package through Nx Release
        if: ${{ !inputs.verify_only }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_PROJECT: ${{ inputs.project }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run release:publish -- --projects="$RELEASE_PROJECT" --dry-run
          else
            npm run release:publish -- --projects="$RELEASE_PROJECT"
          fi
