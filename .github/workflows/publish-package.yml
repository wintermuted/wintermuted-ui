name: Publish package (recovery)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing matching package tag (choose exactly one recovery source)"
        required: false
      prepared_run:
        description: "Auto Release or recovery preview run containing immutable packages"
        required: false
      source_run:
        description: "Legacy artifact-free recovery: only run 45091280105, React 1.0.0"
        required: false
      version:
        description: "Exact expected version (required for run recovery)"
        required: false
      project:
        description: "Only package to recover"
        type: choice
        options: [ui-theme, ui-react]
        default: ui-react
      dry_run:
        description: "Preview publication without publishing"
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: wintermuted-ui-theme
    env:
      NX_DAEMON: "false"
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify recovery source without preparing new versions
        id: source
        run: node scripts/release-recovery.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREPARED_RUN: ${{ inputs.prepared_run }}
          SOURCE_RUN: ${{ inputs.source_run }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PROJECT: ${{ inputs.project }}
      - uses: actions/checkout@v4
        if: steps.source.outputs.mode != 'artifact'
        with:
          ref: ${{ steps.source.outputs.ref }}
          path: release-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1 --registry=https://registry.npmjs.org
      - name: Verify recovery and selective-publication regressions
        run: node --test scripts/release-publication.test.mjs scripts/release-recovery.test.mjs
      - run: npm ci --no-audit --no-fund
        if: steps.source.outputs.mode != 'artifact'
        working-directory: release-source
      - name: Verify package release identity
        if: steps.source.outputs.mode != 'artifact'
        working-directory: release-source
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_PROJECT: ${{ inputs.project }}
        run: |
          VERSION=$(node -p "require('./packages/' + process.env.RELEASE_PROJECT + '/package.json').version")
          if [ "$RELEASE_VERSION" != "$VERSION" ]; then
            echo "The recovery source does not match the requested package version."
            exit 1
          fi
      - name: Stage React package
        if: inputs.project == 'ui-react' && steps.source.outputs.mode != 'artifact'
        working-directory: release-source
        run: npx nx build ui-react
      - name: Pack only the selected source package
        if: steps.source.outputs.mode != 'artifact'
        run: node scripts/release-publication.mjs prepare
        env:
          RELEASE_SOURCE_DIR: release-source
          RELEASE_PROJECTS: ${{ inputs.project }}
      - name: Download the original prepared release
        if: steps.source.outputs.mode == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_RUN: ${{ inputs.prepared_run }}
          PACKAGE_ARTIFACT: ${{ steps.source.outputs.artifact }}
          ATTEMPT_ARTIFACT: ${{ steps.source.outputs.attempts }}
        run: |
          gh run download "$PREPARED_RUN" --repo "$GITHUB_REPOSITORY" --name "$PACKAGE_ARTIFACT" --dir .nx/prepared-release
          gh run download "$PREPARED_RUN" --repo "$GITHUB_REPOSITORY" --name "$ATTEMPT_ARTIFACT" --dir .nx/attempt-evidence
          cp .nx/attempt-evidence/publication-attempts.json .nx/prepared-release/publication-attempts.json
      - name: Preserve recovery evidence before publication
        env:
          SOURCE_REF: ${{ steps.source.outputs.ref }}
          SOURCE_MODE: ${{ steps.source.outputs.mode }}
          SOURCE_RUN: ${{ inputs.source_run || inputs.prepared_run }}
        run: |
          node -e 'require("node:fs").writeFileSync(`.nx/prepared-release/recovery-context-${process.env.GITHUB_RUN_ID}.json`, JSON.stringify({ref:process.env.SOURCE_REF,mode:process.env.SOURCE_MODE,run:process.env.SOURCE_RUN},null,2))'
      - name: Record read-only legacy 1.0 registry evidence
        if: steps.source.outputs.mode == 'legacy'
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const evidence = {};
            for (const project of ["ui-theme", "ui-react"]) {
              const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(`@wintermuted/${project}`)}`, { signal: AbortSignal.timeout(30000) });
              const metadata = await response.json();
              const version = metadata.versions?.["1.0.0"];
              evidence[project] = { status: response.status, name: metadata.name, version: version?.version, dist: version?.dist, error: metadata.error };
            }
            writeFileSync(".nx/prepared-release/registry-before.json", JSON.stringify(evidence,null,2));
            console.log(JSON.stringify(evidence,null,2));
          '
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-packages
          path: .nx/prepared-release/
          if-no-files-found: error
          retention-days: 90
      - name: Publish only the selected missing package and verify integrity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_PROJECTS: ${{ inputs.project }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_AUTH: token
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/release.npmrc
        run: |
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/release.npmrc"
          node scripts/release-publication.mjs publish
      - name: Preserve public registry verification after recovery
        if: inputs.dry_run == false
        env:
          RELEASE_PROJECT: ${{ inputs.project }}
        run: |
          node --input-type=module -e '
            import { existsSync, readFileSync, writeFileSync } from "node:fs";
            import { isPublished } from "./scripts/release-publication.mjs";
            const directory = ".nx/prepared-release/";
            const { packages } = JSON.parse(readFileSync(directory + "publication.json","utf8"));
            const selected = packages.filter(pkg => pkg.project === process.env.RELEASE_PROJECT);
            const verified = [];
            for (const pkg of selected) {
              if (!await isPublished(pkg)) throw new Error("Selected publication is not publicly visible.");
              verified.push({ name: pkg.name, version: pkg.version, integrity: pkg.integrity });
            }
            const snapshot = directory + "registry-before.json";
            if (existsSync(snapshot) && process.env.RELEASE_PROJECT === "ui-react") {
              const theme = JSON.parse(readFileSync(snapshot,"utf8"))["ui-theme"];
              if (theme.status !== 200 || !await isPublished({ name: theme.name, version: theme.version, integrity: theme.dist?.integrity })) throw new Error("Previously published theme identity could not be verified.");
              verified.push({ name: theme.name, version: theme.version, integrity: theme.dist.integrity, unchanged: true });
            }
            writeFileSync(directory + "registry-after.json", JSON.stringify(verified,null,2));
            console.log(JSON.stringify(verified,null,2));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-publication-attempts
          path: .nx/prepared-release/publication-attempts.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: success() && inputs.dry_run == false
        with:
          name: registry-verification
          path: .nx/prepared-release/registry-after.json
          if-no-files-found: error
          retention-days: 90
