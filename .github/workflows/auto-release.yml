name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_source:
        description: "Exact original source commit of an already-published release. Verify/reconcile only; never publish."
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  compatibility:
    uses: ./.github/workflows/react-package.yml

  release:
    needs: compatibility
    runs-on: ubuntu-latest
    environment: wintermuted-ui-theme
    outputs:
      released: ${{ steps.release.outputs.released }}
      theme_released: ${{ steps.release.outputs.theme_released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      NX_DAEMON: "false"
      NX_INTERACTIVE: "false"
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Save reconciliation tools and validate recovery source
        env:
          RECOVERY_SOURCE: ${{ inputs.recovery_source }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/release-{reconcile,publication}.mjs "$RUNNER_TEMP/release-tools/"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [[ "$RECOVERY_SOURCE" =~ ^[a-f0-9]{40}$ ]] || { echo "Recovery requires a full source SHA."; exit 1; }
          fi
      - name: Check out the release source after the compatibility gate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery_source || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1 --registry=https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Prepare versions, changelogs, commit and tags with Nx Release
        id: release
        run: npm run release -- --prepare
      - name: Stage React package with the prepared release version
        if: steps.release.outputs.projects != ''
        run: npx nx build ui-react
      - name: Build and check the released showcase
        if: steps.release.outputs.showcase_released == 'true'
        run: |
          npm run showcase:build
          npm run test:showcase-output
      - name: Archive the released static site
        if: steps.release.outputs.showcase_released == 'true'
        env:
          SHOWCASE_VERSION: ${{ steps.release.outputs.showcase_version }}
        run: |
          touch dist/packages/showcase/.nojekyll
          tar -czf "dist/showcase-$SHOWCASE_VERSION.tar.gz" -C dist/packages/showcase .nojekyll showcase
          verify_dir="$(mktemp -d "$RUNNER_TEMP/showcase-archive.XXXXXX")"
          tar -xzf "dist/showcase-$SHOWCASE_VERSION.tar.gz" -C "$verify_dir"
          diff -qr dist/packages/showcase "$verify_dir"
      - name: Save the prepared release before any publication
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_TAGS: ${{ steps.release.outputs.tags }}
        run: |
          read -r -a tags <<< "$RELEASE_TAGS"
          git bundle create .nx/prepared-release.bundle HEAD "${tags[@]}"
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.released == 'true'
        with:
          name: prepared-release-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 90
          path: |
            .nx/release-state.json
            .nx/prepared-release.bundle
            dist/packages/ui-react
            dist/showcase-*.tar.gz
          if-no-files-found: error
      - name: Publish and verify each prepared package (recovery is strictly read-only)
        if: steps.release.outputs.projects != ''
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node "$RUNNER_TEMP/release-tools/release-publication.mjs" --verify-only
          else
            node "$RUNNER_TEMP/release-tools/release-publication.mjs"
          fi
        env:
          RELEASE_PROJECTS: ${{ steps.release.outputs.projects }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Push the release commit and package tags atomically
        if: steps.release.outputs.released == 'true'
        run: node "$RUNNER_TEMP/release-tools/release-reconcile.mjs"
      - name: Return to the immutable prepared tree for finalization
        if: steps.release.outputs.released == 'true'
        run: git switch --detach "$(node -p "require('./.nx/release-state.json').commit")"
      - name: Create the GitHub release with Nx Release
        if: steps.release.outputs.released == 'true'
        run: npm run release -- --finalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the static site to its GitHub release
        if: steps.release.outputs.showcase_released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHOWCASE_VERSION: ${{ steps.release.outputs.showcase_version }}
          SHOWCASE_TAG: ${{ steps.release.outputs.showcase_tag }}
        run: gh release upload "$SHOWCASE_TAG" "dist/showcase-$SHOWCASE_VERSION.tar.gz" --clobber

  downstream:
    needs: release
    if: github.event_name == 'push' && needs.release.outputs.theme_released == 'true'
    uses: ./.github/workflows/bump-downstream.yml
    with:
      version: ${{ needs.release.outputs.version }}
      release_tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
