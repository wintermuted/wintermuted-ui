name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  compatibility:
    uses: ./.github/workflows/react-package.yml

  release:
    needs: compatibility
    runs-on: ubuntu-latest
    environment: wintermuted-ui-theme
    outputs:
      released: ${{ steps.release.outputs.released }}
      theme_released: ${{ steps.release.outputs.theme_released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      NX_DAEMON: "false"
      NX_INTERACTIVE: "false"
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1 --registry=https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Prepare versions, changelogs, commit and tags with Nx Release
        id: release
        run: npm run release -- --prepare
      - name: Stage React package with the prepared release version
        if: steps.release.outputs.released == 'true'
        run: npx nx build ui-react
      - name: Preserve immutable packages and interrupted-release state
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_PROJECTS: ${{ steps.release.outputs.projects }}
          RELEASE_TAGS: ${{ steps.release.outputs.tags }}
        run: |
          node scripts/release-publication.mjs prepare
          cp .nx/release-state.json .nx/prepared-release/release-state.json
          read -r -a tags <<< "$RELEASE_TAGS"
          git bundle create .nx/prepared-release/release.bundle HEAD "${tags[@]}"
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.released == 'true'
        with:
          name: prepared-release
          path: .nx/prepared-release/
          if-no-files-found: error
          retention-days: 90
      - name: Publish prepared packages (trusted)
        id: publish_trusted
        if: steps.release.outputs.released == 'true'
        continue-on-error: true
        run: node scripts/release-publication.mjs publish
      - name: Publish only verified missing packages (token fallback)
        id: publish_token
        if: steps.release.outputs.released == 'true' && steps.publish_trusted.outcome != 'success'
        continue-on-error: true
        run: |
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/release.npmrc"
          node scripts/release-publication.mjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/release.npmrc
          RELEASE_AUTH: token
      - name: Ensure publication succeeded
        if: steps.release.outputs.released == 'true' && steps.publish_trusted.outcome != 'success' && steps.publish_token.outcome != 'success'
        run: |
          echo "Package publication or registry verification failed. Recover from the prepared-release artifact; do not rerun version preparation blindly."
          exit 1
      - uses: actions/upload-artifact@v4
        if: always() && steps.release.outputs.released == 'true'
        with:
          name: publication-attempts
          path: .nx/prepared-release/publication-attempts.json
          if-no-files-found: warn
          retention-days: 90
      - name: Push the release commit and package tags atomically
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_TAGS: ${{ steps.release.outputs.tags }}
        run: |
          read -r -a tags <<< "$RELEASE_TAGS"
          git push --atomic origin HEAD:main "${tags[@]}"
      - name: Create the GitHub release with Nx Release
        if: steps.release.outputs.released == 'true'
        run: npm run release -- --finalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  downstream:
    needs: release
    if: needs.release.outputs.theme_released == 'true'
    uses: ./.github/workflows/bump-downstream.yml
    with:
      version: ${{ needs.release.outputs.version }}
      release_tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
