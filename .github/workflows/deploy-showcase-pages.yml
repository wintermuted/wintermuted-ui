name: Deploy Documentation to GitHub Pages
# Deploys main to the Pages root while keeping PR previews under previews/pr-<number>/.
# This allows production and preview deployments to coexist on gh-pages.
#
# Two-job design:
#   deploy  - runs for push and pull_request to build and publish content to gh-pages.
#   publish - waits for the uploaded artifact, then deploys production or preview Pages content.

on:
  push:
    branches:
      - main
    paths:
      - "packages/showcase/**"
      - "packages/storybook/**"
      - "packages/ui-theme/**"
      - "packages/ui-react/**"
      - "packages/ui-react-select/**"
      - "nx.json"
      - "scripts/stage-react.mjs"
      - "scripts/stage-pages*"
      - "scripts/pages-workflows.test.mjs"
      - "scripts/check-showcase.mjs"
      - "scripts/coverage-reporter*"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/deploy-showcase-pages.yml"
      - ".github/workflows/cleanup-showcase-preview.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/showcase/**"
      - "packages/storybook/**"
      - "packages/ui-theme/**"
      - "packages/ui-react/**"
      - "packages/ui-react-select/**"
      - "nx.json"
      - "scripts/stage-react.mjs"
      - "scripts/stage-pages*"
      - "scripts/pages-workflows.test.mjs"
      - "scripts/check-showcase.mjs"
      - "scripts/coverage-reporter*"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/deploy-showcase-pages.yml"
      - ".github/workflows/cleanup-showcase-preview.yml"
  workflow_dispatch:

# contents: write  — push to gh-pages branch
# pull-requests: write — post/update preview comment
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deployment_id: ${{ steps.create_deployment.outputs.deployment_id }}
      artifact_name: ${{ format('github-pages-{0}', github.run_attempt) }}
      site_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run test:coverage
      - name: Upload React unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: react-unit-coverage
          path: coverage
          if-no-files-found: error
      - run: npm run showcase:build
      - run: npm run storybook:build
      - run: npm run test:showcase-output
      - run: node --test scripts/stage-pages.test.mjs scripts/pages-workflows.test.mjs

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create PR deployment record
        if: github.event_name == 'pull_request'
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: `preview/pr-${context.payload.pull_request.number}`,
              description: `Showcase and Storybook preview for PR #${context.payload.pull_request.number}`,
              auto_merge: false,
              required_contexts: []
            });

            core.setOutput('deployment_id', String(deployment.data.id));

      - name: Deploy to gh-pages (full replace)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add --detach ./gh-pages-out FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages ./gh-pages-out
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/stage-pages.mjs "${{ github.event.pull_request.number }}"
            cp -R coverage "gh-pages-out/previews/pr-${{ github.event.pull_request.number }}/coverage"
          else
            node scripts/stage-pages.mjs
            cp -R coverage gh-pages-out/coverage
          fi

          cd gh-pages-out
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Deploy (${{ github.event_name }}): ${{ github.sha }}"
            git push --force origin HEAD:refs/heads/gh-pages
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: gh-pages-out

      - name: Mark PR deployment failure
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = Number('${{ steps.create_deployment.outputs.deployment_id }}');
            if (!deploymentId) {
              core.info('No deployment id found; skipping deployment status update.');
              return;
            }

            const runUrl = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'failure',
              log_url: runUrl,
              description: 'Preview deployment failed'
            });

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && format('preview/pr-{0}', github.event.pull_request.number) || 'github-pages' }}
      url: ${{ github.event_name == 'pull_request' && format('{0}/previews/pr-{1}/storybook/', needs.deploy.outputs.site_url, github.event.pull_request.number) || format('{0}/storybook/', needs.deploy.outputs.site_url) }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.deploy.outputs.artifact_name }}

      - name: Mark PR deployment success
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = Number('${{ needs.deploy.outputs.deployment_id }}');
            if (!deploymentId) {
              core.info('No deployment id found; skipping deployment status update.');
              return;
            }

            const base = '${{ needs.deploy.outputs.site_url }}'.replace(/\/$/, '');
            const previewUrl = `${base}/previews/pr-${context.issue.number}/storybook/`;
            const runUrl = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              environment_url: previewUrl,
              log_url: runUrl,
              description: 'Preview deployed'
            });

      - name: Post or update PR preview links
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const base = '${{ needs.deploy.outputs.site_url }}'.replace(/\/$/, '');
            const preview = `${base}/previews/pr-${context.issue.number}`;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const marker = '<!-- documentation-pages-preview -->';
            const body = `${marker}\n**PR Preview deployed!**\n\n[Open showcase preview](${preview}/showcase/) | [Open Storybook preview](${preview}/storybook/)\n\nProduction: [Showcase](${base}/showcase/) | [Storybook](${base}/storybook/)\n\n_Run \`${context.runId}\` - commit \`${sha}\`_`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' &&
              (comment.body?.includes(marker) || comment.body?.includes('**PR Preview deployed!**')));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Mark PR deployment failure
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = Number('${{ needs.deploy.outputs.deployment_id }}');
            if (!deploymentId) {
              core.info('No deployment id found; skipping deployment status update.');
              return;
            }

            const runUrl = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'failure',
              log_url: runUrl,
              description: 'Preview deployment failed'
            });
