name: Cleanup Documentation PR Preview

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    outputs:
      removed: ${{ steps.remove.outputs.removed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Remove preview directory from gh-pages
        id: remove
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "gh-pages does not exist; nothing to clean."
            exit 0
          fi

          git fetch origin gh-pages
          git worktree add --detach ./gh-pages-out FETCH_HEAD

          preview_dir="gh-pages-out/previews/pr-${{ github.event.pull_request.number }}"
          if [ ! -d "$preview_dir" ]; then
            echo "Preview directory does not exist; nothing to clean."
            exit 0
          fi

          rm -rf "$preview_dir"
          echo "removed=true" >> "$GITHUB_OUTPUT"

          cd gh-pages-out
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Cleanup preview for PR #${{ github.event.pull_request.number }}"
            git push --force origin HEAD:refs/heads/gh-pages
          fi

      - name: Configure Pages
        if: steps.remove.outputs.removed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload cleaned Pages artifact
        if: steps.remove.outputs.removed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-out

  publish:
    needs: cleanup
    if: needs.cleanup.outputs.removed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview removal to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
