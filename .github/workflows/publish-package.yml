name: Publish package (recovery)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing package tag to republish (ui-theme@X.Y.Z or ui-react@X.Y.Z)"
        required: true
      project:
        description: "Package to republish"
        type: choice
        options: [ui-theme, ui-react]
        default: ui-theme
      dry_run:
        description: "Preview publication without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: wintermuted-ui-theme
    env:
      NX_DAEMON: "false"
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1 --registry=https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - name: Verify package release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PROJECT: ${{ inputs.project }}
        run: |
          VERSION=$(node -p "require('./packages/' + process.env.RELEASE_PROJECT + '/package.json').version")
          if [ "$RELEASE_TAG" != "$RELEASE_PROJECT@$VERSION" ]; then
            echo "The requested tag does not match the package version."
            exit 1
          fi
      - name: Stage React package
        if: inputs.project == 'ui-react'
        run: npx nx build ui-react
      - name: Publish package through Nx Release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_PROJECT: ${{ inputs.project }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run release:publish -- --projects="$RELEASE_PROJECT" --dry-run
          else
            npm run release:publish -- --projects="$RELEASE_PROJECT"
          fi
