name: React package compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Use React 18 peers for source behavior and declarations
        if: matrix.react == 18
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund react@18.3.1 react-dom@18.3.1 @types/react@18 @types/react-dom@18
      - name: Run React behavior, package boundaries, and showcase tests
        run: node --test tests/react-components.test.js tests/react.test.js tests/package.test.js tests/showcase.test.js
      - name: Build and typecheck Nx projects
        run: npx nx run-many -t build typecheck
      - run: npm run test:showcase-output
      - name: Preview Nx Release without publishing
        run: npm run release -- --dry-run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify compiled npm packages, select-package isolation, and bundler/NodeNext consumers
        run: npm run test:consumers -- --react-major=${{ matrix.react }}
      - name: Run complete unit and release integration suite
        run: npm test
      - name: Upload Storybook
        if: matrix.react == 19
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: dist/packages/storybook
          if-no-files-found: error
