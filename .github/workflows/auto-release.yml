name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  compatibility:
    uses: ./.github/workflows/react-package.yml

  release:
    needs: compatibility
    runs-on: ubuntu-latest
    environment: wintermuted-ui-theme
    outputs:
      released: ${{ steps.release.outputs.released }}
      theme_released: ${{ steps.release.outputs.theme_released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      NX_DAEMON: "false"
      NX_INTERACTIVE: "false"
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1 --registry=https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Prepare versions, changelogs, commit and tags with Nx Release
        id: release
        run: npm run release -- --prepare
      - name: Stage React package with the prepared release version
        if: steps.release.outputs.projects != ''
        run: npx nx build ui-react
      - name: Build and check the released showcase
        if: steps.release.outputs.showcase_released == 'true'
        run: |
          npm run showcase:build
          npm run test:showcase-output
      - name: Archive the released static site
        if: steps.release.outputs.showcase_released == 'true'
        env:
          SHOWCASE_VERSION: ${{ steps.release.outputs.showcase_version }}
        run: |
          touch dist/packages/showcase/.nojekyll
          tar -czf "dist/showcase-$SHOWCASE_VERSION.tar.gz" -C dist/packages/showcase .nojekyll showcase
          verify_dir="$(mktemp -d "$RUNNER_TEMP/showcase-archive.XXXXXX")"
          tar -xzf "dist/showcase-$SHOWCASE_VERSION.tar.gz" -C "$verify_dir"
          diff -qr dist/packages/showcase "$verify_dir"
      - name: Publish and verify each prepared package
        if: steps.release.outputs.projects != ''
        run: node scripts/release-publication.mjs
        env:
          RELEASE_PROJECTS: ${{ steps.release.outputs.projects }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Push the release commit and package tags atomically
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_TAGS: ${{ steps.release.outputs.tags }}
        run: |
          read -r -a tags <<< "$RELEASE_TAGS"
          git push --atomic origin HEAD:main "${tags[@]}"
      - name: Create the GitHub release with Nx Release
        if: steps.release.outputs.released == 'true'
        run: npm run release -- --finalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the static site to its GitHub release
        if: steps.release.outputs.showcase_released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHOWCASE_VERSION: ${{ steps.release.outputs.showcase_version }}
          SHOWCASE_TAG: ${{ steps.release.outputs.showcase_tag }}
        run: gh release upload "$SHOWCASE_TAG" "dist/showcase-$SHOWCASE_VERSION.tar.gz" --clobber

  downstream:
    needs: release
    if: needs.release.outputs.theme_released == 'true'
    uses: ./.github/workflows/bump-downstream.yml
    with:
      version: ${{ needs.release.outputs.version }}
      release_tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
