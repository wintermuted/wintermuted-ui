name: Bump downstream

# Called after successful Nx publication; release events cover external releases.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      release_tag:
        type: string
        required: true
    secrets:
      DOWNSTREAM_PAT:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to bump to (e.g. 0.2.0)"
        required: true
      release_tag:
        description: "Theme release tag (defaults to ui-theme@<version>)"
        required: false

permissions:
  contents: read

jobs:
  bump:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'ui-theme@') || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - wintermuted/cv
          - wintermuted/sub-killer

    steps:
      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            raw_tag="$RELEASE_TAG"
            version="${raw_tag#ui-theme@}"
            version="${version#v}"
          else
            version="${RELEASE_VERSION#v}"
            raw_tag="${RELEASE_TAG:-ui-theme@$version}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { [ "$raw_tag" != "ui-theme@$version" ] && [ "$raw_tag" != "v$version" ]; }; then
            echo "Invalid theme release version or tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$raw_tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch bump to ${{ matrix.repo }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DOWNSTREAM_PAT }}
          script: |
            const [owner, repo] = '${{ matrix.repo }}'.split('/');
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'ui-theme-release',
              client_payload: {
                version: '${{ steps.ver.outputs.version }}',
                release_tag: '${{ steps.ver.outputs.release_tag }}'
              }
            });
